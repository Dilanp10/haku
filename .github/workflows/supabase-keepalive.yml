name: Supabase keep-alive

# El free tier de Supabase pausa el proyecto tras 7 días sin actividad en la
# API. Este workflow le pega una lectura liviana TODOS los días para que nunca
# llegue a ese límite.
#
# Historia: el intervalo original (cada 5 días) parecía cómodo, pero los bordes
# de mes de `*/5` en día-del-mes generan huecos de más de 7 días (p. ej. del
# día 1 al 6). En cuanto Supabase pausó el proyecto, este workflow tampoco
# pudo despertarlo — sólo mantiene vivo lo que ya está vivo — y las corridas
# siguientes fallaron con "Couldn't resolve host". Diario elimina el problema.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leer una fila de categories (mantiene el proyecto activo)
        run: |
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $status"
          cat /tmp/body.json
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase respondió $status — revisar si el proyecto sigue pausado/activo (restore_project desde el dashboard o vía API)."
            exit 1
          fi
