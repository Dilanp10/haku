name: Supabase keep-alive

# El free tier de Supabase pausa el proyecto tras 7 días sin actividad en la
# API. Este workflow le pega una lectura liviana cada ~5 días para que nunca
# llegue a ese límite. */5 en día-del-mes no es un intervalo perfecto (varía
# un poco en los bordes de mes), pero el peor caso son 5 días exactos — sigue
# estando cómodo debajo del límite de 7.
on:
  schedule:
    - cron: "0 6 */5 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leer una fila de categories (mantiene el proyecto activo)
        run: |
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $status"
          cat /tmp/body.json
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase respondió $status — revisar si el proyecto sigue pausado/activo."
            exit 1
          fi
