# Desarrollo/local de la imagen de la web. El stack de Supabase se gestiona aparte
# con la CLI (`supabase start`), que ya levanta sus propios contenedores.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: haku-web:local
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EVENTS_INGEST_TOKEN: ${EVENTS_INGEST_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
