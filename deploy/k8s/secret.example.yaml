# Plantilla de Secret para Kubernetes / Cloud Code.
# Copiar a secret.yaml (gitignored) y completar valores reales en base64, o crear con:
#   kubectl create secret generic haku-secrets \
#     --from-literal=NEXT_PUBLIC_SUPABASE_URL=... \
#     --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY=... \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#     --from-literal=EVENTS_INGEST_TOKEN=...
apiVersion: v1
kind: Secret
metadata:
  name: haku-secrets
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "your-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-service-role-key"
  EVENTS_INGEST_TOKEN: "your-random-secret"
  NEXT_PUBLIC_APP_URL: "http://<LB_EXTERNAL_IP>"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: "your-vapid-public-key"
  VAPID_PRIVATE_KEY: "your-vapid-private-key"
  VAPID_SUBJECT: "mailto:admin@haku.app"
